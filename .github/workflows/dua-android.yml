name: Build Dua Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dua-tracker/**'
      - '.github/workflows/dua-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: dua-tracker
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dua-tracker-apk
          path: dua-tracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
