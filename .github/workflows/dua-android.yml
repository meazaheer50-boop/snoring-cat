name: Build Dua Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dua-tracker/**'
      - '.github/workflows/dua-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('dua-tracker/**/*.gradle*', 'dua-tracker/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.DUA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DUA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dua.jks"
            echo "DUA_KEYSTORE_FILE=$RUNNER_TEMP/dua.jks" >> "$GITHUB_ENV"
            echo "DUA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret found. Using the temporary debug key, so the APK will not install over an older one."
          fi

      - name: Check Quran text renders with the Quran font
        working-directory: dua-tracker
        run: pip install --quiet fonttools && python3 tools/quran_text.py check

      - name: Build release APK
        working-directory: dua-tracker
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dua-tracker-apk
          path: dua-tracker/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dua-tracker/app/build/outputs/apk/release/app-release.apk DailyDua.apk
          gh release delete dua-tracker-latest --cleanup-tag --yes || true
          gh release create dua-tracker-latest DailyDua.apk --prerelease --target "${{ github.sha }}" --title "Daily Dua" --notes "Optimised release build for Android featuring the Glassmorphism UI, navigation transitions & animations, and bundled audio recordings for Dua Qunoot and Dua Khatm al-Quran."
