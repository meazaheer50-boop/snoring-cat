name: Dua Tracker UI test

on:
  workflow_dispatch:
  push:
    branches: [dua-tracker]
    paths:
      - 'dua-tracker/**'
      - '.github/workflows/dua-ui-test.yml'

jobs:
  screen-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ui-${{ hashFiles('dua-tracker/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build app and test APKs
        working-directory: dua-tracker
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run the screen tour on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          working-directory: dua-tracker
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c || true
            adb shell am instrument -w -e class com.dailydua.tracker.ScreenTour com.dailydua.tracker.test/androidx.test.runner.AndroidJUnitRunner > ../instrument.txt 2>&1 || true
            mkdir -p ../shots
            adb pull /data/local/tmp/shots ../shots/ || true
            adb logcat -d > ../logcat.txt || true
            adb shell settings put global animator_duration_scale 1 || true
            adb shell settings put global transition_animation_scale 1 || true
            adb shell settings put global window_animation_scale 1 || true
            adb shell am force-stop com.dailydua.tracker || true
            adb shell am start -n com.dailydua.tracker/.MainActivity || true
            sleep 4
            adb shell screenrecord --time-limit 8 --size 540x1200 /data/local/tmp/anim.mp4 || true
            adb pull /data/local/tmp/anim.mp4 ../shots/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tour
          path: |
            shots/
            instrument.txt
            logcat.txt
          if-no-files-found: warn
