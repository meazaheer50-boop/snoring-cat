name: Dua Tracker UI test

on:
  workflow_dispatch:
  push:
    branches: [dua-tracker]
    paths:
      - 'dua-tracker/**'
      - '.github/workflows/dua-ui-test.yml'

permissions:
  contents: write

jobs:
  screen-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ui-${{ hashFiles('dua-tracker/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build app and test APKs
        working-directory: dua-tracker
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run the screen tour on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          working-directory: dua-tracker
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c || true
            adb shell am instrument -w -e class com.dailydua.tracker.ScreenTour com.dailydua.tracker.test/androidx.test.runner.AndroidJUnitRunner > ../instrument.txt 2>&1 || true
            mkdir -p ../shots
            adb pull /data/local/tmp/shots ../shots/ || true
            adb logcat -d "*:W" > ../logcat.txt || true
            # Reinstall check: is the backup file there, and does a fresh install restore from it?
            sleep 4
            (echo "--- before uninstall"; adb shell ls -l /sdcard/Documents/DailyDua/; adb shell run-as com.dailydua.tracker cat files/datastore/dua_prefs.preferences_pb | strings | head -40) > ../reinstall.txt 2>&1 || true
            adb uninstall com.dailydua.tracker >> ../reinstall.txt 2>&1 || true
            adb logcat -c || true
            adb install app/build/outputs/apk/debug/app-debug.apk >> ../reinstall.txt 2>&1 || true
            adb shell am start -n com.dailydua.tracker/.MainActivity || true
            sleep 8
            (echo "--- after reinstall"; adb shell run-as com.dailydua.tracker cat files/datastore/dua_prefs.preferences_pb | strings | head -40; adb logcat -d -s AutoBackup:W) >> ../reinstall.txt 2>&1 || true
            # Allow file access (what the user does once from the prompt), come back, and check the restore.
            adb shell appops set --uid com.dailydua.tracker MANAGE_EXTERNAL_STORAGE allow >> ../reinstall.txt 2>&1 || true
            adb shell am force-stop com.dailydua.tracker || true
            adb shell am start -n com.dailydua.tracker/.MainActivity || true
            sleep 8
            (echo "--- after access allowed"; adb shell run-as com.dailydua.tracker cat files/datastore/dua_prefs.preferences_pb | strings | head -40; adb logcat -d -s AutoBackup:W) >> ../reinstall.txt 2>&1 || true
            adb shell settings put global animator_duration_scale 1 || true
            adb shell settings put global transition_animation_scale 1 || true
            adb shell settings put global window_animation_scale 1 || true
            adb shell am force-stop com.dailydua.tracker || true
            adb shell am start -n com.dailydua.tracker/.MainActivity || true
            sleep 4
            adb shell screenrecord --time-limit 8 --size 540x1200 /data/local/tmp/anim.mp4 || true
            adb pull /data/local/tmp/anim.mp4 ../shots/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tour
          path: |
            shots/
            instrument.txt
            logcat.txt
            reinstall.txt
          if-no-files-found: warn

      - name: Publish screenshots to the dua-ui-shots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          cp -r shots instrument.txt logcat.txt reinstall.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b dua-ui-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "UI tour for ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dua-ui-shots
