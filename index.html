<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f3b">
<title>Surprise</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg1: #1b1f3b;
    --bg2: #3a2f5b;
    --accent: #ffb86b;
    --text: #fff7ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg2), var(--bg1));
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  main {
    width: 100%; max-width: 480px; padding: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
    text-align: center;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0; letter-spacing: .02em; }
  p.sub { margin: 0; opacity: .75; font-size: 1rem; }

  #reveal-btn {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-size: 1.25rem; font-weight: 700;
    color: #2a1d12; background: var(--accent);
    padding: 18px 44px; border-radius: 999px;
    box-shadow: 0 10px 30px rgba(255,184,107,.35);
    transition: transform .15s ease, box-shadow .15s ease, opacity .4s ease;
  }
  #reveal-btn:active { transform: scale(.96); }
  #reveal-btn.gone { opacity: 0; pointer-events: none; transform: scale(.8); }

  #stage {
    width: 100%; display: none; flex-direction: column; align-items: center; gap: 8px;
  }
  #stage.show { display: flex; animation: pop .7s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(20px) scale(.85); } to { opacity: 1; transform: none; } }

  .cat-wrap { position: relative; width: min(86vw, 380px); }
  svg#cat { width: 100%; height: auto; display: block; overflow: visible; }

  /* breathing: the whole body gently rises and falls in time with the snore */
  #body-group { transform-origin: 50% 100%; transform-box: fill-box; animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    28%      { transform: scale(1.012, 1.045); }
    55%      { transform: scale(1, 1); }
  }
  #tail { transform-origin: 20% 50%; transform-box: fill-box; animation: tail 5s ease-in-out infinite; }
  @keyframes tail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }

  .zzz { position: absolute; right: 8%; top: 4%; pointer-events: none; }
  .zzz span {
    position: absolute; left: 0; top: 0; font-weight: 800; color: #cfd6ff; opacity: 0;
    animation: float 3.6s ease-in infinite;
    text-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .zzz span:nth-child(1) { font-size: 1.1rem; animation-delay: 0s; }
  .zzz span:nth-child(2) { font-size: 1.6rem; animation-delay: 1.2s; }
  .zzz span:nth-child(3) { font-size: 2.2rem; animation-delay: 2.4s; }
  @keyframes float {
    0%   { transform: translate(0, 40px) rotate(-8deg); opacity: 0; }
    20%  { opacity: .95; }
    100% { transform: translate(34px, -50px) rotate(10deg); opacity: 0; }
  }

  #caption { opacity: .8; font-size: 1.05rem; min-height: 1.4em; }
  #mute-btn {
    appearance: none; border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--text);
    font: inherit; font-size: .9rem; padding: 8px 18px; border-radius: 999px; cursor: pointer; opacity: .8;
  }
  #mute-btn:active { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    #body-group, #tail, .zzz span { animation: none; }
    .zzz span { opacity: .8; }
  }
</style>
</head>
<body>
<main>
  <div id="intro">
    <h1>I have something for you</h1>
    <p class="sub">Tap the button</p>
  </div>

  <button id="reveal-btn" type="button">Tap me</button>

  <section id="stage" aria-live="polite">
    <div class="cat-wrap">
      <div class="zzz" aria-hidden="true"><span>z</span><span>Z</span><span>Z</span></div>

      <svg id="cat" viewBox="0 0 400 260" role="img" aria-label="A cat fast asleep on a cushion">
        <!-- cushion -->
        <ellipse cx="200" cy="232" rx="185" ry="22" fill="#000" opacity=".25"/>
        <path d="M18 205 Q200 160 382 205 Q392 238 360 244 Q200 262 40 244 Q8 238 18 205 Z" fill="#c9566b"/>
        <path d="M30 208 Q200 168 370 208" fill="none" stroke="#e48598" stroke-width="5" stroke-linecap="round" opacity=".7"/>

        <g id="body-group">
          <!-- tail (curled around the front) -->
          <path id="tail" d="M92 200 Q40 205 52 168 Q62 148 92 160" fill="none" stroke="#e9a35c" stroke-width="22" stroke-linecap="round"/>
          <path d="M92 200 Q40 205 52 168" fill="none" stroke="#f6c488" stroke-width="5" stroke-linecap="round" opacity=".6" transform="translate(0,-3)"/>

          <!-- body -->
          <ellipse cx="200" cy="170" rx="128" ry="58" fill="#e9a35c"/>
          <!-- stripes -->
          <g fill="none" stroke="#c97f36" stroke-width="9" stroke-linecap="round" opacity=".75">
            <path d="M150 118 Q156 134 150 150"/>
            <path d="M184 112 Q190 130 184 148"/>
            <path d="M218 112 Q224 130 218 148"/>
            <path d="M252 118 Q258 134 252 150"/>
          </g>
          <!-- belly highlight -->
          <ellipse cx="205" cy="198" rx="90" ry="22" fill="#f6c488" opacity=".55"/>

          <!-- back paw tucked in -->
          <ellipse cx="300" cy="206" rx="34" ry="19" fill="#f2b673"/>
          <!-- front paws under the chin -->
          <ellipse cx="150" cy="212" rx="30" ry="15" fill="#f6c488"/>
          <ellipse cx="195" cy="214" rx="30" ry="15" fill="#f6c488"/>

          <!-- head, resting on the paws -->
          <g id="head">
            <!-- ears -->
            <path d="M104 112 L112 62 L152 94 Z" fill="#e9a35c"/>
            <path d="M114 106 L118 78 L140 95 Z" fill="#f4a0b0"/>
            <path d="M262 112 L254 62 L214 94 Z" fill="#e9a35c"/>
            <path d="M252 106 L248 78 L226 95 Z" fill="#f4a0b0"/>
            <!-- face -->
            <ellipse cx="183" cy="142" rx="84" ry="62" fill="#e9a35c"/>
            <!-- forehead stripes -->
            <g fill="none" stroke="#c97f36" stroke-width="7" stroke-linecap="round" opacity=".8">
              <path d="M183 84 L183 104"/>
              <path d="M163 88 L166 104"/>
              <path d="M203 88 L200 104"/>
            </g>
            <!-- muzzle -->
            <ellipse cx="183" cy="168" rx="34" ry="24" fill="#fbe3c4"/>
            <!-- closed, sleeping eyes -->
            <g fill="none" stroke="#3a2412" stroke-width="5" stroke-linecap="round">
              <path d="M126 140 Q146 156 166 140"/>
              <path d="M200 140 Q220 156 240 140"/>
            </g>
            <!-- cheeks -->
            <ellipse cx="116" cy="164" rx="14" ry="9" fill="#f4a0b0" opacity=".45"/>
            <ellipse cx="250" cy="164" rx="14" ry="9" fill="#f4a0b0" opacity=".45"/>
            <!-- nose + mouth -->
            <path d="M174 157 Q183 150 192 157 Q183 168 174 157 Z" fill="#e57a8d"/>
            <path d="M183 164 L183 172 M183 172 Q173 182 164 175 M183 172 Q193 182 202 175" fill="none" stroke="#3a2412" stroke-width="3" stroke-linecap="round"/>
            <!-- whiskers -->
            <g stroke="#fff4e0" stroke-width="2.2" stroke-linecap="round" opacity=".9">
              <path d="M148 166 L96 158"/><path d="M148 172 L94 176"/><path d="M150 178 L102 192"/>
              <path d="M218 166 L270 158"/><path d="M218 172 L272 176"/><path d="M216 178 L264 192"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <div id="caption">Shhh… the cat is sleeping 😴</div>
    <button id="mute-btn" type="button" aria-pressed="false">🔊 Sound on</button>
  </section>
</main>

<script>
(function () {
  'use strict';

  const btn = document.getElementById('reveal-btn');
  const intro = document.getElementById('intro');
  const stage = document.getElementById('stage');
  const muteBtn = document.getElementById('mute-btn');

  let ctx = null;          // AudioContext, created on the first tap (browsers require a user gesture)
  let master = null;       // master gain, used for mute
  let breaths = [];        // pre-rendered snore breaths
  let snoreTimer = null;
  let muted = false;

  // ---------- Snore synthesis (no audio files needed) ----------
  // A snore is the soft palate flapping ~20-40 times a second. Each flap is a tiny
  // click; the throat turns that click train into a rattly, vowel-like "rrrr".
  // So: pulse train -> throat resonances (formants) + breath noise, shaped by an
  // inhale (louder, rattly) and a softer, breathier exhale.
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // two-pole resonator, coefficients refreshed as the formant moves
  function makeResonator() {
    return { y1: 0, y2: 0, a: 0, b1: 0, b2: 0 };
  }
  function tune(r, f, bw, sr) {
    const rad = Math.exp(-Math.PI * bw / sr);
    const th = 2 * Math.PI * f / sr;
    r.b1 = 2 * rad * Math.cos(th);
    r.b2 = -rad * rad;
    r.a = (1 - rad) * 1.6;
  }
  function run(r, x) {
    const y = r.a * x + r.b1 * r.y1 + r.b2 * r.y2;
    r.y2 = r.y1; r.y1 = y;
    return y;
  }

  function renderBreath(sr, seed) {
    const rand = rng(seed);
    const Ti = 1.2 + rand() * 0.25;     // inhale length
    const Te = 1.3 + rand() * 0.3;      // exhale length
    const gap = 0.12;                   // tiny pause between inhale and exhale
    const dur = Ti + gap + Te + 0.2;
    const n = Math.floor(sr * dur);
    const out = new Float32Array(n);

    // throat resonances: [centre Hz, bandwidth Hz, level]
    const pulseF = [makeResonator(), makeResonator(), makeResonator(), makeResonator()];
    const noiseF = [makeResonator(), makeResonator(), makeResonator()];
    const hissF = makeResonator();

    let phase = 0, jit = 0, lowN = 0, hp1 = 0, hpPrev = 0;
    let amp = 0.7;
    const pw = 0.0024;                  // width of one flap click (seconds)
    let prevG = 0;

    for (let i = 0; i < n; i++) {
      const t = i / sr;
      let inh = 0, exh = 0, x = 0, y = 0;
      if (t < Ti) { x = t / Ti; inh = Math.pow(x, 1.4) * (1 - 0.85 * Math.pow(x, 6)); }
      else if (t > Ti + gap && t < Ti + gap + Te) {
        y = (t - Ti - gap) / Te;
        exh = 0.5 * Math.pow(Math.sin(Math.PI * y), 1.3) * (1 - 0.3 * y);
      }
      const env = inh + exh;

      // update filters and pitch every 32 samples
      if ((i & 31) === 0) {
        const m = t < Ti ? x : y;                          // progress within this half-breath
        const open = t < Ti ? 1 : 0.8;                     // exhale slightly lower / darker
        tune(pulseF[0], (300 + 110 * m) * open, 150, sr);
        tune(pulseF[1], (820 + 260 * m) * open, 240, sr);
        tune(pulseF[2], (1700 + 500 * m) * open, 420, sr);
        tune(pulseF[3], 2700 * open, 700, sr);
        tune(noiseF[0], 520 * open, 320, sr);
        tune(noiseF[1], 1300 * open, 600, sr);
        tune(noiseF[2], 2500 * open, 1100, sr);
        tune(hissF, 3600, 1800, sr);
        jit += ((rand() * 2 - 1) - jit) * 0.12;            // slow random wobble
      }

      // flap rate: ~24 Hz rising to ~40 Hz on the inhale, lower and slower on the exhale
      const f0 = (t < Ti ? 24 + 16 * x : 19 + 8 * (1 - y)) * (1 + 0.14 * jit);
      phase += f0 / sr;
      let g = 0;
      if (phase >= 1) { phase -= 1; amp = 0.65 + 0.35 * rand(); }
      const pwFrac = Math.min(0.3, pw * f0);
      if (phase < pwFrac) g = Math.sin(Math.PI * phase / pwFrac) * amp;
      const click = (g - prevG) * 6;                       // sharp onset = lots of harmonics
      prevG = g;

      // throat-filtered pulse train
      let s = run(pulseF[0], click) * 1.0 + run(pulseF[1], click) * 0.75
            + run(pulseF[2], click) * 0.45 + run(pulseF[3], click) * 0.2;

      // breath noise: strong under the exhale, light under the inhale
      const white = rand() * 2 - 1;
      lowN += (white - lowN) * 0.5;
      let b = run(noiseF[0], lowN) * 1.0 + run(noiseF[1], lowN) * 0.8 + run(noiseF[2], lowN) * 0.4;
      const hiss = run(hissF, white) * 0.5;

      const pulseGain = inh * 1.4 + exh * 0.22;
      const noiseGain = inh * 0.3 + exh * 0.3;
      let v = s * pulseGain + (b + hiss) * noiseGain;

      // high-pass ~110 Hz: phone speakers can't play the deep rumble anyway
      hp1 = 0.985 * (hp1 + v - hpPrev); hpPrev = v;
      out[i] = hp1;
    }

    // normalise, soft-limit, fade the edges
    let peak = 0;
    for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(out[i]));
    const k = 1.9 / (peak || 1);
    const fade = Math.floor(sr * 0.03);
    for (let i = 0; i < n; i++) {
      let v = Math.tanh(out[i] * k) * 0.92;
      if (i < fade) v *= i / fade;
      if (i > n - fade) v *= (n - i) / fade;
      out[i] = v;
    }
    return out;
  }

  function makeBreaths(c) {
    const list = [];
    for (let k = 0; k < 4; k++) {
      const data = renderBreath(c.sampleRate, 1000 + k * 7919);
      const buf = c.createBuffer(1, data.length, c.sampleRate);
      buf.getChannelData(0).set(data);
      list.push(buf);
    }
    return list;
  }

  function snoreOnce() {
    if (!ctx || !breaths.length) return 3000;
    const buf = breaths[Math.floor(Math.random() * breaths.length)];
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 0.96 + Math.random() * 0.08;   // each snore a little different
    const g = ctx.createGain();
    g.gain.value = 0.9 + Math.random() * 0.1;
    src.connect(g).connect(master);
    src.start(ctx.currentTime + 0.03);
    return (buf.duration / src.playbackRate.value) * 1000;
  }

  function startSnoring() {
    if (snoreTimer) return;
    const loop = () => {
      const ms = snoreOnce();
      snoreTimer = setTimeout(loop, ms + 250 + Math.random() * 450);   // short pause between breaths
    };
    loop();
  }

  function setMuted(m) {
    muted = m;
    muteBtn.textContent = m ? '🔇 Sound off' : '🔊 Sound on';
    muteBtn.setAttribute('aria-pressed', String(m));
    if (master && ctx) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.05);
  }

  // ---------- UI ----------
  btn.addEventListener('click', async () => {
    // Create + resume audio inside the click so mobile browsers allow it.
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(ctx.destination);
      breaths = makeBreaths(ctx);
      if (ctx.state === 'suspended') await ctx.resume();
      startSnoring();
    } catch (e) {
      console.warn('Audio unavailable:', e);
    }

    btn.classList.add('gone');
    intro.style.display = 'none';
    setTimeout(() => { btn.style.display = 'none'; }, 400);
    stage.classList.add('show');
  });

  muteBtn.addEventListener('click', () => setMuted(!muted));

  // Pause the snoring when the app is hidden, resume when it's back.
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });
})();
</script>
</body>
</html>
